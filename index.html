<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gujarat Police AI CCTV Command Center</title>
    <meta name="description" content="Gujarat Police On-Premise AI CCTV + Person + Vehicle Operational Intelligence Fabric. Real Geospatial Map, Geolocated Evidence, Multi-Camera Edge Analytics, Forensic Evidence Workflow, Person Watchlist, Human Review Gate, and BSA 2023 Electronic-Record Integrity — Authored by DIVYANSH Shrivastava" />
    <meta name="author" content="DIVYANSH Shrivastava" />
    <meta property="og:title" content="Gujarat Police AI CCTV Command Center" />
    <meta property="og:description" content="Gujarat Police On-Premise AI CCTV + Person + Vehicle Operational Intelligence Fabric. Real Geospatial Map, Geolocated Evidence, Multi-Camera Edge Analytics, Forensic Evidence Workflow, Person Watchlist, Human Review Gate, and BSA 2023 Electronic-Record Integrity — Authored by DIVYANSH Shrivastava" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @keyframes sentinelPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.96); }
      }
    </style>
  </head>
  <body style="background-color: #f8fafc; color: #0f172a;">
    <div id="root">
      <div id="sentinel-initial-loader" style="min-height: 100vh; width: 100%; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(37,99,235,0.15); border: 1px solid rgba(59,130,246,0.35); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; animation: sentinelPulse 2s ease-in-out infinite;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div style="font-size: 16px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff;">SENTINEL GRID</div>
        <div style="font-size: 12px; color: #60a5fa; font-weight: 600; margin-top: 4px; letter-spacing: 0.04em;">GUJARAT POLICE STATE CRIME RECORDS BUREAU</div>
        <div style="margin-top: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: #94a3b8; background: rgba(15,23,42,0.8); border: 1px solid rgba(51,65,85,0.6); padding: 6px 14px; border-radius: 9999px;">
          <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10b981;"></span>
          Initializing Command Center Session...
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (
          !msg ||
          msg.includes('ResizeObserver') || 
          msg.includes('websocket') || 
          msg.includes('WebSocket') || 
          msg.includes('vite') || 
          msg.includes('HMR') ||
          msg.includes('Script error') ||
          msg.includes('chrome-extension') ||
          msg.includes('Extension')
        ) {
          return;
        }
        var loader = document.getElementById('sentinel-initial-loader');
        if (loader && !document.getElementById('sentinel-runtime-alert')) {
          var alertBox = document.createElement('div');
          alertBox.id = 'sentinel-runtime-alert';
          alertBox.style.marginTop = '24px';
          alertBox.style.padding = '16px';
          alertBox.style.borderRadius = '12px';
          alertBox.style.background = 'rgba(239, 68, 68, 0.12)';
          alertBox.style.border = '1px solid rgba(239, 68, 68, 0.35)';
          alertBox.style.maxWidth = '400px';
          alertBox.style.color = '#fca5a5';
          alertBox.style.fontSize = '12px';
          alertBox.style.textAlign = 'center';
          alertBox.innerHTML = '<div style="font-weight: 700; margin-bottom: 6px; color: #f87171;">Command Center Boot Diagnostics</div>' +
            '<div style="font-family: monospace; font-size: 11px; margin-bottom: 12px; word-break: break-word;">' + msg + '</div>' +
            '<button onclick="window.location.reload()" style="background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer;">Reload Application</button>';
          loader.appendChild(alertBox);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
